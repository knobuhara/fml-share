name: Deploy Frontend to Xserver (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue app
        run: npm run build

      - name: Deploy to Xserver via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.XSERVER_HOST }}
          username: ${{ secrets.XSERVER_DEPLOY_DIR_USER }}
          password: ${{ secrets.XSERVER_DEPLOY_DIR_PASSWORD }}
          local-dir: ./dist/
          server-dir: /tower.co.jp/public_html/app/
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false

      - name: Deployment completed
        run: |
          echo "✅ Deployment completed successfully"
          echo "URL: https://bears.xsrv.jp/app/"

